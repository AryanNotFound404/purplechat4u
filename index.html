<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<title>Secret Chat</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="h-[100dvh] w-full overflow-hidden flex flex-col bg-[#0a0818] text-white">

<!-- JOIN SCREEN -->
<div id="joinScreen" class="flex-1 min-h-0 overflow-y-auto flex items-center justify-center p-4">
  <div class="glass rounded-2xl p-6 sm:p-8 w-full max-w-sm my-auto">
    <h1 class="text-2xl font-semibold mb-1 text-center">Secret Chat</h1>
    <p class="text-sm text-purple-300/70 text-center mb-6">Anonymous. No login. Just a code.</p>

    <label class="text-xs text-purple-300/70 mb-1 block">Nickname</label>
    <input id="nickname" maxlength="20" placeholder="Elon Musk"
      class="w-full mb-4 px-4 py-2.5 rounded-lg bg-black/30 border border-purple-500/20 text-gray-100 placeholder-gray-500">

    <label class="text-xs text-purple-300/70 mb-1 block">Secret Room Code</label>
    <input id="roomCode" placeholder="secret789"
      class="w-full mb-4 px-4 py-2.5 rounded-lg bg-black/30 border border-purple-500/20 text-gray-100 placeholder-gray-500">

    <button id="createRoomBtn" class="btn-ghost w-full mb-3 py-2.5 rounded-lg text-sm">Create Random Room</button>
    <button id="joinBtn" class="btn-glow w-full py-2.5 rounded-lg font-medium">Join Secret Chat</button>

    <p id="joinError" class="text-red-400 text-xs mt-3 text-center hidden"></p>
  </div>
</div>

<!-- CHAT SCREEN -->
<div id="chatScreen" class="flex-1 min-h-0 hidden flex flex-col">

  <!-- Header Bar -->
  <header class="flex-none z-10 border-b border-purple-900/40 bg-[#0a0818]/80 backdrop-blur-md px-3 sm:px-4 py-3 flex items-center justify-between gap-2">
    <div id="headerTitleBox" class="min-w-0 flex-1 cursor-pointer hover:opacity-80 transition-opacity" title="Click to view users">
      <p class="text-sm font-semibold truncate">Room: <span id="roomLabel" class="text-purple-300"></span></p>
      <p class="text-xs text-gray-500 truncate">as <span id="nickLabel"></span></p>
      <p id="onlineStatusLabel" class="text-xs text-purple-300/80 mt-0.5 flex items-center gap-1.5 font-normal min-h-[16px]"></p>
    </div>
    
    <div class="flex items-center gap-1.5 shrink-0">
      <!-- TOP RIGHT ROUND CHAT BUTTON -->
      <button id="openMsgModalBtn" title="Send Message" class="w-10 h-10 rounded-full btn-glow flex items-center justify-center shrink-0 shadow-lg border border-purple-400/30">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 text-white">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
      </button>

      <button id="copyLinkBtn" title="Copy Link" class="btn-ghost flex items-center gap-1.5 px-2 py-2 rounded-lg">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 shrink-0"><path d="M9 12a4 4 0 0 1 4-4h2a4 4 0 1 1 0 8h-1"/><path d="M15 12a4 4 0 0 1-4 4H9a4 4 0 1 1 0-8h1"/></svg>
      </button>
      <button id="leaveBtn" title="Leave Room" class="btn-ghost flex items-center gap-1.5 px-2 py-2 rounded-lg">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 shrink-0"><path d="M9 21H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </div>
  </header>

  <!-- Messages List -->
  <div id="messages" class="flex-1 min-h-0 overflow-y-auto p-3 sm:p-4 space-y-3 custom-scroll"></div>

  <!-- Standard Bottom Input Bar -->
  <div class="flex-none z-10 border-t border-purple-900/40 bg-[#0a0818]/90 backdrop-blur-md p-3 sm:p-4 flex gap-2 items-center input-container">
    <button id="plusBtn" title="Send Image" class="plus-btn w-10 h-10 shrink-0 rounded-lg flex items-center justify-center text-xl leading-none">+</button>
    <input type="file" id="imageInput" accept="image/*" class="hidden">
    <input id="msgInput" placeholder="Type a secret..." autocomplete="off"
      class="flex-1 min-w-0 px-4 py-2.5 rounded-lg bg-black/30 border border-purple-500/20 text-gray-100 placeholder-gray-500">
    <button id="sendBtn" class="btn-glow px-4 sm:px-5 py-2.5 rounded-lg font-medium shrink-0">Send</button>
  </div>
</div>

<!-- POPUP MESSAGE MODAL (Triggered by Top Right Round Button) -->
<div id="msgModal" class="fixed inset-0 bg-black/70 backdrop-blur-md hidden items-center justify-center p-4 z-50">
  <div class="glass rounded-2xl p-5 w-full max-w-sm relative border border-purple-500/30 shadow-2xl">
    <div class="flex items-center justify-between mb-3 border-b border-purple-500/20 pb-2">
      <h3 class="font-semibold text-purple-200 text-sm">Send Secret Message</h3>
      <button id="closeMsgModal" class="text-purple-300 hover:text-white text-xl font-bold px-1">&times;</button>
    </div>
    
    <textarea id="modalMsgInput" rows="3" placeholder="Type message here..."
      class="w-full px-3 py-2 rounded-lg bg-black/40 border border-purple-500/30 text-gray-100 placeholder-gray-500 text-sm resize-none mb-3 focus:outline-none focus:border-purple-400"></textarea>
    
    <div class="flex gap-2 justify-end">
      <button id="modalPlusBtn" class="plus-btn px-3 py-2 rounded-lg text-sm">📷 Photo</button>
      <button id="modalSendBtn" class="btn-glow px-5 py-2 rounded-lg font-medium text-sm">Send</button>
    </div>
  </div>
</div>

<!-- USERS MODAL -->
<div id="onlineUsersModal" class="fixed inset-0 bg-black/60 backdrop-blur-md hidden items-center justify-center p-4 z-50">
  <div class="glass rounded-2xl p-6 w-full max-w-sm relative border border-purple-500/30 shadow-2xl">
    <div class="flex items-center justify-between mb-4 border-b border-purple-500/20 pb-3">
      <h2 class="font-semibold text-purple-200 text-base">Users</h2>
      <button id="closeOnlineModal" class="text-purple-300 hover:text-white text-xl font-bold px-1">&times;</button>
    </div>
    <div id="onlineUsersList" class="space-y-2 max-h-60 overflow-y-auto custom-scroll pr-1"></div>
  </div>
</div>

<!-- IMAGE PREVIEW MODAL -->
<div id="imageModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50">
  <button id="closeImageModal" class="absolute top-4 right-4 text-white text-3xl leading-none">&times;</button>
  <img id="imageModalImg" src="" class="max-w-full max-h-full rounded-xl" alt="full size">
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="script.js"></script>
</body>
</html>
